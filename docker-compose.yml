# `make up` runs: db -> one-shot ingest + eval (writes ./reports) -> api on :8000.
# Plain `docker compose up` also works; the api starts once the database is healthy.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p1_rag
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d p1_rag"]
      interval: 2s
      timeout: 3s
      retries: 30

  ingest:
    build: .
    command: ["sh", "-c", "ragevals init-db && ragevals ingest --config all && ragevals eval-all"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/p1_rag
    volumes:
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/p1_rag
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
