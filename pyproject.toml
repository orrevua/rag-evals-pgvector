[project]
name = "ragevals"
version = "0.1.0"
description = "RAG question answering over the FastAPI tutorial with pgvector, plus an evaluation suite that measures each retrieval upgrade."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "orrevua" }]
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pydantic>=2.7",
    "typer>=0.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4"]
openai = ["openai>=1.40"]

[project.scripts]
ragevals = "ragevals.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragevals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # str.split() word lists read better than long list literals

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
